<!doctype html>
<html lang="bn">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>জীবনকে নতুন করে দেখো</title>
    <meta name="description" content="জীবনকে নতুন করে দেখো — বাংলা self-development reading companion" />
    <meta name="theme-color" content="#1B4332" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="JIBON" />
    <link rel="icon" type="image/png" href="/manus-storage/jibon-brand-symbol_97a85699.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Noto+Serif+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (() => {
        const savedPath = sessionStorage.getItem("github-pages-path");
        if (!savedPath) return;
        sessionStorage.removeItem("github-pages-path");
        history.replaceState(null, "", `${window.location.pathname.replace(/\/$/, "")}${savedPath}`);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
